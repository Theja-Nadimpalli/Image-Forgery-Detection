apiVersion : apps/v1
kind : Deployment 

metadata :
   name : backend

spec :
   replicas : 1

   selector : 
      matchLabels :
         app : backend

   template : 
      metadata :
         labels :
            app : backend

      spec :
         containers :
            - name : frontend
              image : thejaraju/backend:init
              ports :
                 - containerPort : 5000